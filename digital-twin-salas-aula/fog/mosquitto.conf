# =====================================================================
#  Mosquitto - no de fog da sala de aula
#  Arquivo: C:\mosquitto\mosquitto.conf
# =====================================================================
#
#  Dois ouvintes, porque sao dois tipos de cliente diferentes:
#
#    1883  MQTT puro sobre TCP  -> a placa ESP8266 e os scripts Python
#    9001  MQTT sobre WebSocket -> o navegador (o painel React)
#
#  O navegador nao fala TCP cru: ele so consegue abrir WebSocket.
#  Por isso o mesmo broker precisa escutar nas duas portas.
# ---------------------------------------------------------------------

# --- ouvinte 1: a placa e os scripts ---------------------------------
listener 1883 0.0.0.0
protocol mqtt

# --- ouvinte 2: o navegador ------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# --- autenticacao -----------------------------------------------------
# Sem isso qualquer um na mesma rede publica no topico da sala.
# Era exatamente o problema do broker publico da HiveMQ.
allow_anonymous false
password_file C:\mosquitto\senhas.txt

# --- persistencia -----------------------------------------------------
# Guarda as mensagens retidas em disco: se o broker reiniciar, o painel
# ainda recebe o ultimo estado conhecido de cada sala.
persistence true
persistence_location C:\mosquitto\data\
autosave_interval 30

# --- log --------------------------------------------------------------
# Serve de evidencia nos experimentos (hora de cada conexao e publicacao).
log_dest file C:\mosquitto\mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# --- limites ----------------------------------------------------------
# O teste de escala sobe ate 50 salas; estes valores sobram com folga.
max_connections -1
max_queued_messages 1000
message_size_limit 8192
